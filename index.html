<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>臺灣地形 AR 學習平台</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family:
        "Microsoft JhengHei",
        "PingFang TC",
        sans-serif;
    }

    [hidden] {
      display: none !important;
    }

    #panel {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 4px 20px #0002;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #174b3d;
    }

    #status {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
      overflow-wrap: anywhere;
    }

    #hint {
      margin: 10px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: #666;
    }

    #start {
      margin-top: 12px;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #176b57;
      color: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      background: #929995;
      cursor: default;
    }

    #controls {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 10px;
      right: 10px;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
    }

    #controls button {
      padding: 12px 14px;
      background: rgba(23, 75, 61, 0.95);
      box-shadow: 0 3px 12px #0002;
    }

    #panel.running {
      padding: 12px 14px;
    }

    #panel.running h1 {
      font-size: 17px;
      margin-bottom: 5px;
    }

    #panel.running #status {
      font-size: 14px;
    }
  </style>

  <script>
    // 展示設定：
    // 高度加強為 GLB 原本的 5 倍，屬於教學視覺效果。
    const TERRAIN_HEIGHT_MULTIPLIER = 5;

    // 模型最長邊相對於圖卡寬度的比例。
    const MODEL_DISPLAY_SIZE = 0.9;

    AFRAME.registerComponent('fit-model', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          try {
            const model = this.el.getObject3D('mesh');
            const THREE = AFRAME.THREE;

            if (!model) {
              throw new Error('未取得模型物件。');
            }

            // 排除這份臺灣模型中遺留的預設立方體。
            const unwanted = [];

            model.traverse((object) => {
              if (object.name === 'Cube') {
                unwanted.push(object);
              }
            });

            unwanted.forEach((object) => {
              if (object.parent) {
                object.parent.remove(object);
              }
            });

            // 使用獨立副本測量尺寸。
            // 避免受到 AR 目標尚未辨識時的上層縮放影響。
            const measuringModel = model.clone(true);

            measuringModel.updateWorldMatrix(true, true);

            const box = new THREE.Box3().setFromObject(
              measuringModel
            );

            if (box.isEmpty()) {
              throw new Error('模型沒有可顯示的網格。');
            }

            const size = box.getSize(
              new THREE.Vector3()
            );

            const center = box.getCenter(
              new THREE.Vector3()
            );

            const longest = Math.max(
              size.x,
              size.y,
              size.z
            );

            if (
              !Number.isFinite(longest) ||
              longest <= 0
            ) {
              throw new Error('模型尺寸無效。');
            }

            const scale = MODEL_DISPLAY_SIZE / longest;

            // 整體縮放並置中。
            model.position.multiplyScalar(scale);

            model.position.sub(
              center.multiplyScalar(scale)
            );

            model.scale.multiplyScalar(scale);

            // 這份臺灣 GLB 的高度方向為 Y 軸。
            model.scale.y *= TERRAIN_HEIGHT_MULTIPLIER;
            model.position.y *= TERRAIN_HEIGHT_MULTIPLIER;

            model.updateMatrix();
            model.updateWorldMatrix(true, true);

            this.el.dataset.fitReady = 'true';

            this.el.emit(
              'fit-ready',
              {},
              false
            );

          } catch (error) {
            console.error('模型處理失敗：', error);

            this.el.dataset.fitError = error.message;

            this.el.emit(
              'fit-error',
              { message: error.message },
              false
            );
          }
        });
      }
    });
  </script>
</head>

<body>
  <div id="panel">
    <h1>臺灣地形 AR 學習平台</h1>

    <div
      id="status"
      role="status"
      aria-live="polite"
    >
      正在載入臺灣地形模型……
    </div>

    <button
      id="start"
      type="button"
      disabled
    >
      載入中
    </button>

    <p id="hint">
      請掃描指定圖卡。
      本展示將地形高度加強為原模型的 5 倍，
      方便觀察山地起伏，非真實比例。
    </p>
  </div>

  <div id="controls" hidden>
    <button id="smaller" type="button">縮小</button>
    <button id="larger" type="button">放大</button>
    <button id="rotate" type="button">旋轉</button>
    <button id="view" type="button">切換角度</button>
    <button id="reset" type="button">重設</button>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "
    renderer="
      colorManagement: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
  >
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      light="type: ambient; intensity: 0.9"
    ></a-entity>

    <a-entity
      light="type: directional; intensity: 1.2"
      position="-1 2 3"
    ></a-entity>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <!-- 放大、縮小與平面旋轉的外層 -->
      <a-entity
        id="modelContainer"
        position="0 0 0.18"
        rotation="0 0 0"
        scale="1 1 1"
      >
        <!--
          這份臺灣地形沿 XZ 平面展開。
          55 度為預設斜角，90 度為貼齊圖卡。
        -->
        <a-entity
          id="model"
          gltf-model="url(./model.glb)"
          fit-model
          rotation="55 0 0"
        ></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const target = document.querySelector('#target');
    const model = document.querySelector('#model');

    const modelContainer = document.querySelector(
      '#modelContainer'
    );

    const panel = document.querySelector('#panel');
    const startButton = document.querySelector('#start');
    const statusText = document.querySelector('#status');
    const controls = document.querySelector('#controls');
    const hint = document.querySelector('#hint');

    let sceneReady = Boolean(scene.hasLoaded);
    let modelReady = false;
    let failed = false;
    let starting = false;
    let running = false;

    let displayScale = 1;
    let displayAngle = 0;

    // 依序切換：斜角、較低角度、貼齊圖卡。
    const viewAngles = [55, 25, 90];
    let viewIndex = 0;

    function setStatus(message) {
      statusText.textContent = message;
    }

    function updateReadyState() {
      if (failed || starting || running) {
        return;
      }

      if (sceneReady && modelReady) {
        startButton.disabled = false;
        startButton.textContent = '啟動 AR 鏡頭';

        setStatus(
          '模型已載入，請點選按鈕，並允許使用相機。'
        );
      }
    }

    function failModel(message) {
      failed = true;

      startButton.disabled = true;
      startButton.textContent = '模型載入失敗';

      setStatus(message);
    }

    scene.addEventListener('loaded', () => {
      sceneReady = true;
      updateReadyState();
    });

    model.addEventListener('fit-ready', () => {
      modelReady = true;
      updateReadyState();
    });

    model.addEventListener('fit-error', (event) => {
      failModel(
        '模型處理失敗：' + event.detail.message
      );
    });

    model.addEventListener('model-error', (event) => {
      console.error('GLB 載入失敗：', event.detail);

      failModel(
        '無法載入 model.glb。請確認已上傳真正的 GLB 檔案，' +
        '且與 index.html 放在同一資料夾。'
      );
    });

    // 若模型已由快取完成載入，直接讀取保存狀態。
    if (model.dataset.fitReady === 'true') {
      modelReady = true;
    }

    if (model.dataset.fitError) {
      failModel(
        '模型處理失敗：' + model.dataset.fitError
      );
    }

    updateReadyState();

    function cameraErrorMessage(error) {
      const name = error?.name || '';

      if (name === 'NotAllowedError') {
        return (
          '相機權限未開啟。請允許此網站使用相機，' +
          '再重新整理頁面。'
        );
      }

      if (name === 'NotFoundError') {
        return '找不到相機，請使用有鏡頭的手機。';
      }

      if (name === 'NotReadableError') {
        return (
          '相機目前無法使用。請關閉其他使用相機的程式，' +
          '再重新整理頁面。'
        );
      }

      return (
        'AR 啟動失敗。請確認相機權限已開啟，' +
        '且 targets.mind 已上傳至同一資料夾。' +
        '修正後請重新整理頁面。'
      );
    }

    function failAR(error) {
      console.error('AR 啟動失敗：', error);

      failed = true;
      running = false;
      starting = false;

      controls.hidden = true;
      startButton.hidden = false;
      startButton.disabled = true;
      startButton.textContent = '請重新整理後再試';

      setStatus(cameraErrorMessage(error));

      try {
        const ar = scene.systems['mindar-image-system'];

        if (ar) {
          ar.stop();
        }
      } catch (stopError) {
        console.warn(stopError);
      }
    }

    scene.addEventListener('arError', (event) => {
      failAR(
        event.detail?.error ||
        event.detail ||
        event
      );
    });

    scene.addEventListener('arReady', () => {
      if (failed) {
        return;
      }

      starting = false;
      running = true;

      startButton.hidden = true;
      controls.hidden = false;
      hint.hidden = true;

      panel.classList.add('running');

      setStatus(
        '請對準完整圖卡。地形高度已加強 5 倍。'
      );
    });

    startButton.addEventListener('click', async () => {
      if (
        failed ||
        starting ||
        running ||
        !sceneReady ||
        !modelReady
      ) {
        return;
      }

      if (
        !window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia
      ) {
        setStatus(
          '無法使用相機。請用手機瀏覽器，' +
          '開啟 GitHub Pages 的 HTTPS 網址。'
        );

        return;
      }

      starting = true;
      startButton.disabled = true;
      startButton.textContent = '啟動中';

      setStatus(
        '正在啟動鏡頭，若出現權限詢問，請選擇「允許」。'
      );

      try {
        const ar = scene.systems['mindar-image-system'];

        if (!ar) {
          throw new Error('AR 系統尚未就緒。');
        }

        await ar.start();

      } catch (error) {
        failAR(error);
      }
    });

    target.addEventListener('targetFound', () => {
      if (failed) {
        return;
      }

      setStatus(
        '辨識成功！可切換角度觀察山地起伏。高度加強 5 倍。'
      );
    });

    target.addEventListener('targetLost', () => {
      if (!running || failed) {
        return;
      }

      setStatus(
        '圖卡離開鏡頭，請重新對準完整圖卡。'
      );
    });

    function updateModelDisplay() {
      modelContainer.setAttribute(
        'scale',
        `${displayScale} ${displayScale} ${displayScale}`
      );

      modelContainer.setAttribute(
        'rotation',
        `0 0 ${displayAngle}`
      );

      model.setAttribute(
        'rotation',
        `${viewAngles[viewIndex]} 0 0`
      );
    }

    document.querySelector('#smaller')
      .addEventListener('click', () => {
        displayScale = Math.max(
          0.3,
          displayScale / 1.2
        );

        updateModelDisplay();
      });

    document.querySelector('#larger')
      .addEventListener('click', () => {
        displayScale = Math.min(
          3,
          displayScale * 1.2
        );

        updateModelDisplay();
      });

    document.querySelector('#rotate')
      .addEventListener('click', () => {
        displayAngle = (displayAngle + 30) % 360;
        updateModelDisplay();
      });

    document.querySelector('#view')
      .addEventListener('click', () => {
        viewIndex = (viewIndex + 1) % viewAngles.length;
        updateModelDisplay();
      });

    document.querySelector('#reset')
      .addEventListener('click', () => {
        displayScale = 1;
        displayAngle = 0;
        viewIndex = 0;

        updateModelDisplay();
      });

    window.addEventListener('pagehide', () => {
      try {
        const ar = scene.systems['mindar-image-system'];

        if (ar) {
          ar.stop();
        }
      } catch (error) {
        console.warn(error);
      }
    });
  </script>
</body>
</html>
